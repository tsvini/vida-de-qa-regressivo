name: Regressivo
# EP32: o completo roda de madrugada. Cron em UTC: 9h UTC = 6h em Brasília
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      regressao:
        description: 'Liga um bug antigo de propósito (ex: duplicado). Vazio roda normal'
        default: ''
# EP34: o GitHub vive em UTC, o usuário vive em Brasília. Testa como ele vê
env:
  TZ: America/Sao_Paulo
# EP36: o pipeline pode abrir e comentar cards (issues) no repositório
permissions:
  contents: read
  issues: write
jobs:
  cypress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: cypress-io/github-action@v6
        with:
          # EP39: o servidor do FlowDesk sobe antes dos testes
          start: npm run api
          wait-on: 'http://localhost:3000/api/saude'
          command: >-
            npx cypress run --browser chrome
            ${{ inputs.regressao && format('--expose regressao={0}', inputs.regressao) || '' }}
      # EP33: só quando falha, com tudo que o time precisa pra entender sem perguntar
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: evidencia-regressivo
          path: |
            relatorio/
            cypress/screenshots/
            cypress/videos/
          if-no-files-found: ignore
      # EP36: vermelho da noite vira card. Já tem um aberto? Comenta nele
      - uses: actions/github-script@v7
        if: failure()
        with:
          script: |
            const { owner, repo } = context.repo;
            const link = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const hoje = new Date().toLocaleDateString('pt-BR');
            const { data: abertos } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'regressivo' });
            if (abertos.length) {
              await github.rest.issues.createComment({ owner, repo,
                issue_number: abertos[0].number,
                body: `Falhou de novo em ${hoje}.\nExecução: ${link}` });
            } else {
              await github.rest.issues.create({ owner, repo,
                labels: ['regressivo'],
                title: `Regressivo vermelho em ${hoje}`,
                body: ['O regressivo da noite falhou.',
                  `Execução e evidências: ${link}`,
                  'Quem pegar, coloca o nome aqui. Prazo: meio-dia.'].join('\n\n') });
            }
