name: Regressivo
# EP32: o completo roda de madrugada. Cron em UTC: 9h UTC = 6h em Brasília
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      regressao:
        description: 'Liga um bug antigo de propósito (ex: duplicado). Vazio roda normal'
        default: ''
# EP34: o GitHub vive em UTC, o usuário vive em Brasília. Testa como ele vê
env:
  TZ: America/Sao_Paulo
# EP36: o pipeline pode abrir e comentar cards (issues) no repositório
permissions:
  contents: read
  issues: write
jobs:
  cypress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: cypress-io/github-action@v6
        with:
          command: npx cypress run --browser chrome ${{ inputs.regressao && format('--expose regressao={0}', inputs.regressao) || '' }}
      # EP33: só quando falha, com tudo que o time precisa pra entender sem perguntar
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: evidencia-regressivo
          path: |
            relatorio/
            cypress/screenshots/
            cypress/videos/
          if-no-files-found: ignore
      # EP36: vermelho da noite vira card com dono. Se já tem um aberto, comenta nele em vez de abrir outro
      - uses: actions/github-script@v7
        if: failure()
        with:
          script: |
            const link = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: abertos } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'regressivo' });
            if (abertos.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: abertos[0].number,
                body: `Falhou de novo em ${new Date().toLocaleString('pt-BR')}.\nExecução: ${link}` });
            } else {
              await github.rest.issues.create({ ...context.repo, labels: ['regressivo'],
                title: `Regressivo vermelho em ${new Date().toLocaleDateString('pt-BR')}`,
                body: `O regressivo da noite falhou.\n\nExecução e evidências (print, vídeo e relatório): ${link}\n\nQuem pegar, coloca seu nome aqui. Prazo: meio-dia.` });
            }
