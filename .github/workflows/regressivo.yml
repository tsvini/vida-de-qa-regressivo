name: Regressivo
# EP32: o completo roda de madrugada. Cron em UTC: 9h UTC = 6h em Brasília
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
# EP34: o GitHub vive em UTC, o usuário vive em Brasília. Testa como ele vê
env:
  TZ: America/Sao_Paulo
jobs:
  cypress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: cypress-io/github-action@v6
        with:
          browser: chrome
      # EP33: só quando falha, com tudo que o time precisa pra entender sem perguntar
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: evidencia-regressivo
          path: |
            relatorio/
            cypress/screenshots/
            cypress/videos/
          if-no-files-found: ignore
