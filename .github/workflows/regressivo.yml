name: Regressivo
# EP32: o completo roda de madrugada, com calma. O cron do GitHub é em UTC: 9h UTC = 6h em Brasília
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
jobs:
  cypress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: cypress-io/github-action@v6
        with:
          browser: chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio
          path: |
            relatorio/
            cypress/screenshots/
          if-no-files-found: ignore
