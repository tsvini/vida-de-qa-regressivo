name: Smoke
# EP32: no pedido de revisão roda só o que é rápido e crítico (tag @smoke)
on:
  pull_request:
  workflow_dispatch:
# EP34: a máquina do GitHub vive em UTC. O usuário do FlowDesk vive em Brasília: o pipeline testa como ele vê
env:
  TZ: America/Sao_Paulo
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: cypress-io/github-action@v6
        with:
          command: npx cypress run --browser chrome --expose tags=@smoke
      # EP33: só quando falha, com tudo que o time precisa pra entender sem perguntar
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: evidencia-smoke
          path: |
            relatorio/
            cypress/screenshots/
            cypress/videos/
          if-no-files-found: ignore
