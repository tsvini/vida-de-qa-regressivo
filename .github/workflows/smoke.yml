name: Smoke
# EP32: no pedido de revisão roda só o que é rápido e crítico (tag @smoke)
on:
  pull_request:
  workflow_dispatch:
# EP34: o GitHub vive em UTC, o usuário vive em Brasília. Testa como ele vê
env:
  TZ: America/Sao_Paulo
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # EP44: primeiro o servidor. Se ele estiver quebrado, para aqui, sem esperar a tela
      - uses: cypress-io/github-action@v6
        with:
          start: npm run api
          wait-on: 'http://localhost:3000/api/saude'
          command: npx cypress run --browser chrome --expose "tags=@smoke and @api"
      - uses: cypress-io/github-action@v6
        with:
          install: false
          command: npx cypress run --browser chrome --expose "tags=@smoke and not @api"
      # EP33: só quando falha, com tudo que o time precisa pra entender sem perguntar
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: evidencia-smoke
          path: |
            relatorio/
            cypress/screenshots/
            cypress/videos/
          if-no-files-found: ignore
